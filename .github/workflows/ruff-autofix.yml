name: Ruff Audit

on:
  push:
    branches:
      - maintenance/ruff-cleanup

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/ruff-cleanup
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Report remaining Ruff issues
        working-directory: backend
        run: ruff check app tests --output-format concise
