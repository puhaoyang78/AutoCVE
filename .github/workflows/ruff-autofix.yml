name: Ruff Exception Chaining

on:
  push:
    branches:
      - maintenance/ruff-cleanup

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/ruff-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Add explicit exception chaining
        working-directory: backend
        run: ruff check app tests --select B904 --fix --unsafe-fixes --exit-zero
      - name: Verify B904 is resolved
        working-directory: backend
        run: ruff check app tests --select B904
      - name: Verify diff
        run: git diff --check
      - name: Commit exception chaining
        run: |
          if git diff --quiet; then
            echo "No B904 changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "Add explicit exception chaining"
          git push origin HEAD:maintenance/ruff-cleanup
