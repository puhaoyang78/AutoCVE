name: Ruff Exception Chaining

on:
  push:
    branches:
      - maintenance/ruff-cleanup

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/ruff-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Add explicit exception chaining
        working-directory: backend
        shell: bash
        run: |
          ruff check app tests --select B904 --output-format json > /tmp/b904.json || true
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          issues = json.loads(Path("/tmp/b904.json").read_text())
          rows_by_file = {}
          for issue in issues:
              rows_by_file.setdefault(Path(issue["filename"]), set()).add(int(issue["location"]["row"]))

          for path, issue_rows in rows_by_file.items():
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              lines = source.splitlines(keepends=True)

              handlers = [node for node in ast.walk(tree) if isinstance(node, ast.ExceptHandler)]
              raises = [node for node in ast.walk(tree) if isinstance(node, ast.Raise) and node.cause is None]

              for row in sorted(issue_rows, reverse=True):
                  candidates = [
                      node for node in raises
                      if node.lineno <= row <= (node.end_lineno or node.lineno)
                  ]
                  if not candidates:
                      raise RuntimeError(f"No raise node for {path}:{row}")
                  raise_node = min(candidates, key=lambda node: (node.end_lineno or node.lineno) - node.lineno)

                  enclosing = [
                      node for node in handlers
                      if node.lineno <= raise_node.lineno <= (node.end_lineno or node.lineno)
                  ]
                  if not enclosing:
                      raise RuntimeError(f"No except handler for {path}:{row}")
                  handler = min(enclosing, key=lambda node: (node.end_lineno or node.lineno) - node.lineno)
                  cause = handler.name or "None"

                  end_index = (raise_node.end_lineno or raise_node.lineno) - 1
                  raw = lines[end_index]
                  newline = "\n" if raw.endswith("\n") else ""
                  body = raw[:-1] if newline else raw
                  if " from " not in body:
                      lines[end_index] = body + f" from {cause}" + newline

              path.write_text("".join(lines), encoding="utf-8")
          PY
          ruff check app tests --select B904
      - name: Verify diff
        run: git diff --check
      - name: Commit exception chaining
        run: |
          if git diff --quiet; then
            echo "No B904 changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "Add explicit exception chaining"
          git push origin HEAD:maintenance/ruff-cleanup
