name: Ruff Whitespace Cleanup

on:
  push:
    branches:
      - maintenance/ruff-cleanup

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/ruff-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Remove only Ruff-reported trailing whitespace
        working-directory: backend
        shell: bash
        run: |
          ruff check app tests --select W291,W293 --output-format json > /tmp/ruff-whitespace.json || true
          python - <<'PY'
          import json
          from pathlib import Path

          issues = json.loads(Path("/tmp/ruff-whitespace.json").read_text())
          rows_by_file = {}
          for issue in issues:
              path = Path(issue["filename"])
              row = int(issue["location"]["row"])
              rows_by_file.setdefault(path, set()).add(row)

          for path, rows in rows_by_file.items():
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              for row in rows:
                  index = row - 1
                  raw = lines[index]
                  newline = "\n" if raw.endswith("\n") else ""
                  body = raw[:-1] if newline else raw
                  lines[index] = body.rstrip(" \t") + newline
              path.write_text("".join(lines), encoding="utf-8")
          PY
          ruff check app tests --select W291,W293
      - name: Verify diff
        run: git diff --check
      - name: Commit whitespace cleanup
        run: |
          if git diff --quiet; then
            echo "No whitespace changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "Remove Ruff-reported trailing whitespace"
          git push origin HEAD:maintenance/ruff-cleanup
