name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e '.[dev]'
      - name: Check backend runtime hygiene
        run: |
          if grep -R -n -E '(FindingRuntimeStack|finding_runtime_stack|finding_skill_router|evidence_type|evidence_gaps|legacy_text_tool_calls|ALLOW_LEGACY_TEXT_TOOL_CALLS|test_finding_v2|test_legacy_|test_compat_)' app tests; then
            echo "Obsolete backend runtime compatibility identifier detected."
            exit 1
          fi
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Lint backend
        run: ruff check app tests
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend dependency hygiene
        run: |
          if grep -R -n -E '(@supabase/supabase-js|miaoda-auth-react|miaoda-sc-plugin|@google/generative-ai|shared/config/database|\bdbMode\b|\bisDemoMode\b|\bisLocalMode\b)' src package.json pnpm-lock.yaml vite.config.ts; then
            echo "Obsolete frontend compatibility dependency or path detected."
            exit 1
          fi
      - name: Lint frontend
        run: pnpm lint
      - name: Type-check frontend
        run: pnpm type-check
      - name: Run frontend tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build


  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.cn.yml config --quiet
