name: Verify frontend pnpm Docker build

on:
  push:
    branches:
      - frontend-pnpm-build-fix

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build frontend image
        run: docker build -t autocve-frontend-test ./frontend

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
