name: Cleanup Finding runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-finding-runtime.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/cleanup_finding_bridge.py
      - run: python scripts/cleanup_finding_runtime.py
      - run: |
          python -m py_compile \
            backend/app/services/finding_runtime/query_loop.py \
            backend/app/services/finding_runtime/models.py \
            backend/app/services/finding_runtime/fingerprint.py \
            backend/app/services/finding_runtime/bridge.py \
            backend/app/services/direct_audit_vulnerability_service.py \
            backend/app/services/one_click_cve/runner.py \
            backend/app/api/v1/endpoints/agent_tasks.py \
            backend/app/models/agent_task.py \
            backend/app/core/config.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Finish Finding runtime cleanup"
          git push origin HEAD:main
