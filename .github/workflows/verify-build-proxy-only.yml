name: Verify build-only proxy support

on:
  push:
    branches:
      - build-proxy-only

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply build proxy changes
        run: python .github/scripts/apply_build_proxy_only.py

      - name: Validate compose
        run: docker compose config >/tmp/autocve-compose.yml

      - name: Assert runtime containers do not inherit proxy variables
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docker-compose.yml').read_text()
          for service in ['backend:', 'agent-worker:', 'one-click-cve-worker:', 'frontend:']:
              assert service in text
          runtime_bad = [
              "HTTP_PROXY: ''", "HTTPS_PROXY: ''", "NO_PROXY: '*'",
          ]
          for item in runtime_bad:
              assert item not in text, item
          for token in ['HTTP_PROXY: ${HTTP_PROXY:-}', 'HTTPS_PROXY: ${HTTPS_PROXY:-}', 'host.docker.internal:host-gateway']:
              assert token in text, token
          PY

      - name: Assert Dockerfiles no longer force proxy bypass
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ['backend/Dockerfile','frontend/Dockerfile','docker/sandbox/Dockerfile']:
              text = Path(path).read_text()
              assert 'ENV HTTP_PROXY=""' not in text, path
              assert 'unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY' not in text, path
              assert 'Proxy "false"' not in text, path
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified changes
        run: |
          git config user.name 'puhaoyang78'
          git config user.email '313678673+puhaoyang78@users.noreply.github.com'
          git add docker-compose.yml backend/Dockerfile frontend/Dockerfile docker/sandbox/Dockerfile
          git commit -m 'fix: support build-time Docker proxy only [skip ci]'
          git push origin HEAD:build-proxy-only
