name: Verify history management changes

on:
  push:
    branches:
      - autocve-improvements-run

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_history_management.py

      - name: Check whitespace
        run: git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Run focused backend tests
        working-directory: backend
        run: pytest -q tests/api/test_agent_tasks_runtime_session.py -k 'agent_task_routes_include_runtime_session_id or create_agent_task_persists_version_snapshot'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend
        run: npm install --global pnpm@9 && cd frontend && pnpm install --frozen-lockfile

      - name: Type check frontend
        working-directory: frontend
        run: pnpm type-check

      - name: Commit verified changes
        run: |
          git config user.name 'puhaoyang78'
          git config user.email '313678673+puhaoyang78@users.noreply.github.com'
          git add backend/app/api/v1/endpoints/agent_tasks.py frontend/src/shared/api/agentTasks.ts frontend/src/pages/AuditTasks.tsx
          git commit -m 'feat: improve audit history management [skip ci]'
          git push origin HEAD:autocve-improvements-run
