name: Verify final audit tail

on:
  push:
    branches:
      - final-audit-tail

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final audit fixes
        run: python .github/scripts/apply_final_audit_tail.py

      - name: Check whitespace
        run: git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend
        run: python -m pip install -e './backend[dev]' aiosqlite

      - name: Run focused backend tests
        working-directory: backend
        run: |
          pytest -q tests/services/test_run_code_cpp.py
          pytest -q tests/api/test_agent_task_history_management.py
          python -m py_compile app/services/agent/tools/run_code.py app/api/v1/endpoints/agent_tasks.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend
        run: npm install --global pnpm@9 && cd frontend && pnpm install --frozen-lockfile

      - name: Type check frontend
        working-directory: frontend
        run: pnpm type-check

      - name: Validate Docker Compose
        run: docker compose config >/tmp/autocve-compose.yml

      - name: Commit verified changes
        run: |
          git config user.name 'puhaoyang78'
          git config user.email '313678673+puhaoyang78@users.noreply.github.com'
          git add backend/app/services/agent/tools/run_code.py \
                  backend/env.example \
                  backend/tests/services/test_run_code_cpp.py \
                  backend/tests/api/test_agent_task_history_management.py
          git commit -m 'fix: preserve dynamic verification evidence [skip ci]'
          git push origin HEAD:final-audit-tail
