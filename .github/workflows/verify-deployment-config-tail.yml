name: Verify deployment config tail

on:
  push:
    branches:
      - deployment-config-tail

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deployment config fixes
        run: python .github/scripts/apply_deployment_config_tail.py
      - name: Verify env names match Settings
        run: |
          python - <<'PY'
          from pathlib import Path
          env = Path('backend/env.example').read_text()
          cfg = Path('backend/app/core/config.py').read_text()
          for name in ['AGENT_MAX_ITERATIONS','AGENT_TIMEOUT_SECONDS','VECTOR_DB_PATH','SANDBOX_NETWORK_MODE','SANDBOX_TIMEOUT']:
              assert f'{name}:' in cfg, name
              assert f'{name}=' in env, name
          for obsolete in ['AGENT_TIMEOUT=','CHROMA_PERSIST_DIRECTORY=','SANDBOX_NETWORK_DISABLED=']:
              assert obsolete not in env, obsolete
          PY
      - name: Validate Docker Compose
        run: docker compose config >/tmp/autocve-compose.yml
      - name: Check whitespace
        run: git diff --check
      - name: Commit verified config
        run: |
          git config user.name 'puhaoyang78'
          git config user.email '313678673+puhaoyang78@users.noreply.github.com'
          git add backend/env.example
          git commit -m 'fix: align deployment example with runtime settings [skip ci]'
          git push origin HEAD:deployment-config-tail
