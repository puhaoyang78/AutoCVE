name: Verify C/C++ verification changes

on:
  push:
    branches:
      - cpp-verification

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_cpp_verification.py

      - name: Check whitespace
        run: git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal backend test dependencies
        run: python -m pip install pytest pydantic pydantic-settings docker

      - name: Run focused C/C++ tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q tests/services/test_run_code_cpp.py

      - name: Compile RunCode module
        working-directory: backend
        run: python -m py_compile app/services/agent/tools/run_code.py app/services/agent/agents/verification.py

      - name: Commit verified changes
        run: |
          git config user.name 'puhaoyang78'
          git config user.email '313678673+puhaoyang78@users.noreply.github.com'
          git add backend/app/services/agent/tools/run_code.py \
                  backend/app/services/agent/agents/verification.py \
                  backend/tests/services/test_run_code_cpp.py
          git commit -m 'feat: add C/C++ dynamic verification [skip ci]'
          git push origin HEAD:cpp-verification
