name: Apply audited runtime cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-audited-runtime-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified cleanup patch
        shell: bash
        run: |
          cat .github/cleanup.parts/part_* > /tmp/runtime-cleanup.patch.gz.b64
          echo "55fe98b62cf0aeb733bea491dcc137dbb76fdbb2c711f9ca82fa35a852c0db46  /tmp/runtime-cleanup.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/runtime-cleanup.patch.gz.b64 | gzip -d > /tmp/runtime-cleanup.patch
          echo "65c4cefd46379ab01d877932f5c1845d8716a95eff6972ad3d902f30f587017f  /tmp/runtime-cleanup.patch" | sha256sum -c -
          git apply --check /tmp/runtime-cleanup.patch
          git apply /tmp/runtime-cleanup.patch
          python -m compileall -q backend/app backend/tests
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -r .github/cleanup.parts
          git rm .github/workflows/apply-audited-runtime-cleanup.yml
          git add -A
          git diff --cached --check
          git commit -m "Remove obsolete Finding runtime compatibility paths"
          git push origin HEAD:main
