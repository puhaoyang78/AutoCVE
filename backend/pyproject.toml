[project]
name = "autocve-backend"
version = "3.0.4"
description = "AutoCVE Backend API - AI-Powered Code Security Audit Platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "AutoCVE Team" }
]
keywords = ["security", "audit", "code-review", "vulnerability", "ai", "llm"]

dependencies = [
    # ============ Web Framework ============
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sse-starlette>=1.8.2",
    # ============ Database ============
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.1",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "redis>=5.0.0",
    # ============ Data Validation ============
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.1.0",
    # ============ Authentication ============
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "bcrypt>=4.0.0,<5.0.0",
    # ============ HTTP Client ============
    "httpx[socks]>=0.25.0",
    # ============ LLM Integration ============
    "litellm>=1.0.0",
    "tiktoken>=0.5.2",
    # ============ Report Generation ============
    "reportlab>=4.0.0",
    "weasyprint>=60.0",
    "jinja2>=3.1.6",
    # ============ Utilities ============
    "json-repair>=0.30.0",
    "aiofiles>=23.2.1",
    # ============ LangChain & LangGraph ============
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.40",
    # ============ Vector Database ============
    "chromadb>=0.4.22",
    # ============ Code Parsing ============
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.4.0",
    "pygments>=2.17.0",
    # ============ Docker Sandbox ============
    "docker>=7.0.0",
    # ============ Security Tools ============
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "pip-audit>=2.6.0",
    # ============ Kunlun-M Dependencies (MIT License) ============
    "pyjsparser>=2.7.1",
    "phply>=1.2.6",
    "esprima>=4.0.1",
    "jsbeautifier>=1.14.0",
    "colorlog>=6.0.0",
    "portalocker>=2.0.0",
    "prettytable>=3.0.0",
    "rarfile>=4.0",
    "beautifulsoup4>=4.12.0",
    "django>=4.2.0",
    "arq>=0.28.0",
]

[project.optional-dependencies]
mysql = ["mysqlclient>=2.2.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
    "aiosqlite>=0.22.1",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = [
    "migrations/",
    ".venv/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --import-mode=importlib"

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
